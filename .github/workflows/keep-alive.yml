name: Keep Backend Alive

on:
    schedule:
        - cron: "*/13 * * * *"
    workflow_dispatch:
jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping backend
              run: |
                  curl -s https://proxier-tali-backend-db083.containers.snapdeploy.app/health > /dev/null
